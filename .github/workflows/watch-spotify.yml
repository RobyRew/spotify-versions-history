name: Watch Spotify releases
# Two sensors, see docs/SPOTIFY_DOWNLOADS.md: HEAD on Spotify's permanent installer URLs (no
# account) and, when the SPOTIFY_CREDENTIALS secret exists, Spotify's desktop update service.
# Spotify's own clients poll every ~4 h, so 30 minutes is already ahead of them; GitHub delays
# schedules under load, which is fine for this purpose.
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      archive:
        description: 'Attach captured installers to the spotify-installers release (overrides the SPOTIFY_ARCHIVE_TAG variable for this run)'
        type: boolean
        default: false
permissions:
  contents: write
  actions: write
concurrency:
  group: watch-spotify
  cancel-in-progress: false
jobs:
  watch:
    if: github.repository == 'RobyRew/spotify-versions-history'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Secrets cannot be tested in a step's `if`; a job-level flag can.
      HAS_CREDENTIALS: ${{ secrets.SPOTIFY_CREDENTIALS != '' }}
      # Archiving is opt-in: set the SPOTIFY_ARCHIVE_TAG repository variable, or tick the input for one run.
      ARCHIVE_RELEASE_TAG: ${{ inputs.archive && 'spotify-installers' || vars.SPOTIFY_ARCHIVE_TAG }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/setup-python@v6
        if: env.HAS_CREDENTIALS == 'true'
        with:
          python-version: '3.13'
      - name: Install the update-service client
        if: env.HAS_CREDENTIALS == 'true'
        run: |
          python3 -m pip install --quiet "git+https://github.com/kokarare1212/librespot-python@683d9e76f91ba7ae03919494dac8d899ca505651"
          python3 site/scripts/probe-update-service.py --self-test
      - name: Check Spotify's servers and record new builds
        id: watch
        env:
          GH_TOKEN: ${{ github.token }}
          SPOTIFY_CREDENTIALS: ${{ secrets.SPOTIFY_CREDENTIALS }}
        run: node site/scripts/watch-official.mjs
      - name: Validate the catalog with the new observations
        if: steps.watch.outputs.changed == 'true'
        run: node --test scripts/test-site.mjs
      - name: Commit the observations and rebuild the library
        if: steps.watch.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/data/official.json
          git commit -m 'Record Spotify builds seen by the release watcher'
          git pull --rebase origin main
          git push origin HEAD:main
          # A push made with GITHUB_TOKEN starts no workflow; dispatch the Pages build explicitly.
          gh workflow run pages.yml --ref main
